<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#E50914" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Nền Squircle sang trọng chuẩn Netflix -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#E50914" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Trái tim Tình yêu phát sáng trung tâm -->
  <path d="M32 49 C30.8 48 16 35.5 16 23.5 C16 16.8 21.2 11.5 27.5 11.5 C30.8 11.5 31.8 13 32 14 C32.2 13 33.2 11.5 36.5 11.5 C42.8 11.5 48 16.8 48 23.5 C48 35.5 33.2 48 32 49 Z" 
        fill="url(#heartGrad)" 
        filter="url(#glow)"/>

  <!-- Điểm nhấn biểu tượng Play trắng nhỏ tinh tế giữa trái tim -->
  <polygon points="30,22 36,26 30,30" fill="#ffffff" opacity="0.95"/>
</svg>
